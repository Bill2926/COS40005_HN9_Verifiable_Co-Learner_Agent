name: Deploy

on:
  workflow_run:
    workflows: ["Schema push"]
    types: [completed]

permissions:
  actions: read
  contents: read

# One deploy attempt per commit. A newer commit has its own group.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      # Schema push already succeeded for this commit. Check runs beside it,
      # so wait until typecheck, test, and the migration dry-run are green.
      # The hook builds whatever main points at, so a commit that is no longer
      # the tip does not deploy.
      - name: Deploy this commit to Render
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "Add the GitHub Actions secret RENDER_DEPLOY_HOOK (the Render deploy hook URL)."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            json="$(gh run list --workflow check.yml --commit "$SHA" --json status,conclusion --limit 1)"
            status="$(jq -r '.[0].status // "missing"' <<<"$json")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<<"$json")"
            echo "Check attempt ${attempt}: status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              break
            fi
            if [ "$status" = "completed" ]; then
              echo "Check finished with ${conclusion}."
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Check did not finish within 20 minutes."
              exit 1
            fi
            sleep 20
          done
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_sha" != "$SHA" ]; then
            echo "main is ${main_sha}. A later commit deploys instead."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
