name: Schema push

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: schema-push
  cancel-in-progress: false

jobs:
  push:
    name: schema push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref nopyjjyimtmvuucsirxb --yes
