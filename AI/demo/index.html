<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Co-Learner ML Lab</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header class="intro">
      <p class="project">Verifiable Co-Learner</p>
      <h1>ML Lab</h1>
      <p>Try the experimental prompt classifier with an English example. Inference runs on this machine.</p>
    </header>
    <section class="panel" aria-labelledby="prompt-heading">
      <h2 id="prompt-heading">Prompt classification</h2>
      <form id="prompt-form">
        <label for="prompt">English prompt</label>
        <textarea id="prompt" rows="5" maxlength="4000" autocomplete="off" spellcheck="false"
          aria-describedby="prompt-help" placeholder="Why does my Python loop skip an item?"></textarea>
        <p class="help" id="prompt-help">The model scores text for the historical self-harm content label.</p>
        <button type="submit">Classify prompt</button>
      </form>
      <div id="prompt-result" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    </section>
    <details class="panel">
      <summary>Model details</summary>
      <p id="model-status">Loading model information…</p>
      <dl id="model-details"></dl>
    </details>
  </main>
</body>
</html>
